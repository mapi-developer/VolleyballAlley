services:
  db:
    image: postgres:15
    container_name: volleyball_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: volleyball_alley
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - volleyball_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d volleyball_alley"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: volleyball_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/volleyball_alley
      - BOT_TOKEN=${BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - volleyball_net

  frontend:
    build: ./frontend
    container_name: volleyball_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - volleyball_net

  nginx:
    image: nginx:alpine
    container_name: volleyball_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - volleyball_net

networks:
  volleyball_net:
    driver: bridge

volumes:
  postgres_data: